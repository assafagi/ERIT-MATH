<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירית רביב אגי - הוראת מתמטיקה</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-indigo-700 text-white shadow-md p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">אירית רביב אגי - הוראת מתמטיקה</h1>
                <p class="text-xs text-indigo-200">ניהול עסק, שיעורים, קבלות ודו"ח מס שנתי</p>
            </div>
            <div class="text-xs bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-600 text-emerald-300 font-semibold">
                ✓ נשמר במכשיר
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- כרטיסיות סיכום -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500">הכנסות ששולמו</p>
                <p id="totalIncome" class="text-xl font-bold text-emerald-600 mt-1">₪0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500">חוב פתוח</p>
                <p id="totalUnpaid" class="text-xl font-bold text-amber-600 mt-1">₪0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500">הוצאות מוכרות במס</p>
                <p id="totalExpenses" class="text-xl font-bold text-rose-600 mt-1">₪0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm bg-indigo-50">
                <p class="text-xs font-semibold text-indigo-600">רווח חייב במס</p>
                <p id="taxableProfit" class="text-xl font-bold text-indigo-900 mt-1">₪0</p>
            </div>
        </div>

        <!-- טופס הוספת שיעור -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h2 class="font-bold text-lg text-slate-800 border-b pb-2">+ תיעוד שיעור חדש</h2>
            <form id="lessonForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="studentName" placeholder="שם התלמיד" required class="p-2 border rounded text-sm">
                <input type="date" id="lessonDate" required class="p-2 border rounded text-sm">
                <input type="number" id="lessonAmount" placeholder="סכום (₪)" required class="p-2 border rounded text-sm">
                <select id="paymentStatus" class="p-2 border rounded text-sm">
                    <option value="שולם - ביט">שולם - ביט</option>
                    <option value="שולם - מזומן">שולם - מזומן</option>
                    <option value="שולם - העברה">שולם - העברה</option>
                    <option value="טרם שולם">טרם שולם</option>
                </select>
                <input type="text" id="lessonNotes" placeholder="נושא השיעור / הערות" class="p-2 border rounded text-sm md:col-span-2">
                <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded text-sm hover:bg-indigo-700 md:col-span-3">שמור שיעור</button>
            </form>
        </div>

        <!-- טופס הוספת הוצאה -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h2 class="font-bold text-lg text-slate-800 border-b pb-2">+ תיעוד הוצאה / קבלה</h2>
            <form id="expenseForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="expenseTitle" placeholder="תיאור ההוצאה" required class="p-2 border rounded text-sm">
                <input type="number" id="expenseAmount" placeholder="סכום ברוטו (₪)" required class="p-2 border rounded text-sm">
                <select id="expenseCategory" class="p-2 border rounded text-sm">
                    <option value="100">ציוד לימודי וספרות (100% מוכר)</option>
                    <option value="45">נסיעות ודלק (45% מוכר)</option>
                    <option value="25">הוצאות בית / חדר עבודה (25% מוכר)</option>
                    <option value="100">שיווק, פרסום ותוכנות (100% מוכר)</option>
                </select>
                <button type="submit" class="bg-rose-600 text-white font-semibold py-2 px-4 rounded text-sm hover:bg-rose-700 md:col-span-3">שמור הוצאה</button>
            </form>
        </div>

        <!-- טבלת רשימת פעילויות -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-lg text-slate-800">רשימת שיעורים והוצאות שנרשמו</h2>
                <button onclick="clearAllData()" class="text-xs text-rose-600 hover:underline">איפוס נתונים</button>
            </div>
            <div id="recordsList" class="space-y-2 text-sm"></div>
        </div>

    </main>

    <script>
        const STORAGE_KEY = 'irit_math_app_data';

        let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { lessons: [], expenses: [] };

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            render();
        }

        document.getElementById('lessonDate').valueAsDate = new Date();

        document.getElementById('lessonForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const date = document.getElementById('lessonDate').value;
            const amount = Number(document.getElementById('lessonAmount').value);
            const status = document.getElementById('paymentStatus').value;
            const notes = document.getElementById('lessonNotes').value;

            appData.lessons.push({ id: Date.now(), name, date, amount, status, notes });
            saveData();
            this.reset();
            document.getElementById('lessonDate').valueAsDate = new Date();
        };

        document.getElementById('expenseForm').onsubmit = function(e) {
            e.preventDefault();
            const title = document.getElementById('expenseTitle').value;
            const amount = Number(document.getElementById('expenseAmount').value);
            const percent = Number(document.getElementById('expenseCategory').value);

            appData.expenses.push({ id: Date.now(), title, amount, percent });
            saveData();
            this.reset();
        };

        function deleteItem(type, id) {
            if(confirm('האם למחוק פריט זה?')) {
                appData[type] = appData[type].filter(item => item.id !== id);
                saveData();
            }
        }

        function clearAllData() {
            if(confirm('האם למחוק את כל הנתונים?')) {
                appData = { lessons: [], expenses: [] };
                saveData();
            }
        }

        function render() {
            let totalPaid = 0;
            let totalUnpaid = 0;
            let totalDeductibleExpense = 0;

            const listEl = document.getElementById('recordsList');
            listEl.innerHTML = '';

            if (appData.lessons.length === 0 && appData.expenses.length === 0) {
                listEl.innerHTML = '<p class="text-slate-400 text-center py-4">טרם נרשמו שיעורים או הוצאות</p>';
            }

            // הצגת שיעורים
            appData.lessons.forEach(l => {
                const isPaid = !l.status.includes('טרם');
                if (isPaid) totalPaid += l.amount;
                else totalUnpaid += l.amount;

                listEl.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                        <div>
                            <span class="font-bold">${l.name}</span> <span class="text-xs text-slate-500">(${l.date})</span>
                            <p class="text-xs text-slate-600">${l.status} • ${l.notes || 'ללא הערות'}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold ${isPaid ? 'text-emerald-600' : 'text-amber-600'}">₪${l.amount}</span>
                            <button onclick="deleteItem('lessons', ${l.id})" class="text-xs text-rose-500 font-semibold">מחיקה</button>
                        </div>
                    </div>
                `;
            });

            // הצגת הוצאות
            appData.expenses.forEach(e => {
                const deductible = e.amount * (e.percent / 100);
                totalDeductibleExpense += deductible;

                listEl.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-rose-50/50 rounded-lg border border-rose-100">
                        <div>
                            <span class="font-bold text-slate-800">[הוצאה] ${e.title}</span>
                            <p class="text-xs text-slate-500">${e.percent}% מוכר במס (₪${deductible.toFixed(0)})</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-rose-600">₪${e.amount}</span>
                            <button onclick="deleteItem('expenses', ${e.id})" class="text-xs text-rose-500 font-semibold">מחיקה</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('totalIncome').innerText = `₪${totalPaid.toLocaleString()}`;
            document.getElementById('totalUnpaid').innerText = `₪${totalUnpaid.toLocaleString()}`;
            document.getElementById('totalExpenses').innerText = `₪${Math.round(totalDeductibleExpense).toLocaleString()}`;
            document.getElementById('taxableProfit').innerText = `₪${Math.max(0, Math.round(totalPaid - totalDeductibleExpense)).toLocaleString()}`;
        }

        render();
    </script>
</body>
</html>
