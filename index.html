
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירית רביב אגי - ניהול עסק</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      // כאן מודבק קוד ה-React של האפליקציה
      const { useState, useEffect } = React;

      function App() {
        return (
          <div class="p-6 max-w-4xl mx-auto">
            <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg mb-6">
              <h1 class="text-2xl font-bold">אירית רביב אגי - הוראת מתמטיקה</h1>
              <p class="text-indigo-100 text-sm mt-1">מערכת ניהול שיעורים, הוצאות ודוחות מס</p>
            </header>
            <main class="bg-white p-6 rounded-2xl shadow border border-slate-100 text-center">
              <h2 class="text-xl font-semibold text-slate-700 mb-2">המערכת מוכנה ופעילה!</h2>
              <p class="text-slate-500">כל הנתונים שתרשמו יישמרו באופן קבוע במכשיר זה ולא יימחקו ברענון.</p>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
