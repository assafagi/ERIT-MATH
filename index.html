<!-- מסך נעילה ב-PIN -->
<div id="pinOverlay" style="position:fixed; inset:0; background-color:#0f172a; z-index:99999; display:flex; align-items:center; justify-content:center; padding:1rem;">
    <form id="pinForm" onsubmit="window.checkPin(event)" class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xs text-center space-y-4">
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
            🔒
        </div>
        <h2 class="text-xl font-bold text-slate-800">אבטחת אפליקציה</h2>
        <p class="text-sm text-slate-500">הקש קוד גישה בן 4 ספרות</p>

        <div class="space-y-3">
            <input type="password" id="pinInput" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autofocus autocomplete="off" class="w-full text-center text-2xl font-bold tracking-widest border-2 border-slate-200 rounded-xl py-3 focus:border-indigo-600 focus:outline-none transition" />
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition">כניסה</button>
        </div>

        <p id="pinError" class="text-xs text-red-500 hidden font-bold">קוד שגוי, נסה שוב</p>
    </form>
</div>

<script>
    // ------------------------------------
    // אימות PIN מבוטח (0544)
    // ------------------------------------
    const SECRET_PIN = "0544";

    window.checkPin = function(e) {
        if (e) e.preventDefault(); // מניעת רענון הדף במידה ומדובר ב-Form

        const input = document.getElementById("pinInput");
        const overlay = document.getElementById("pinOverlay");
        const errorMsg = document.getElementById("pinError");

        if (!input) return;

        const enteredPin = String(input.value).trim();

        if (enteredPin === SECRET_PIN) {
            if (overlay) {
                // הסרה מוחלטת בכל הדרכים האפשריות
                overlay.style.display = "none";
                overlay.classList.add("hidden");
                try {
                    overlay.remove();
                } catch(err) {
                    if (overlay.parentNode) {
                        overlay.parentNode.removeChild(overlay);
                    }
                }
            }
        } else {
            if (errorMsg) errorMsg.classList.remove("hidden");
            input.value = "";
            input.focus();
        }
    };

    // בדיקה אוטומטית ברגע שמקלידים 4 ספרות
    document.addEventListener("DOMContentLoaded", function() {
        const pinInput = document.getElementById("pinInput");
        if (pinInput) {
            pinInput.addEventListener("input", function() {
                if (this.value.trim().length === 4) {
                    window.checkPin();
                }
            });
        }
    });
</script>
